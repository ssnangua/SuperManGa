[package]
name = "supermanga"
version = "1.0.3"
description = "A local manga and webtoon reader"
authors = ["ssnangua"]
edition = "2024"

[lib]
name = "supermanga_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2.2"
sevenz-rust2 = "0.24"
unrar-ng = "0.7"
encoding_rs = "0.8"
pdfium-render = { version = "0.8", default-features = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "rayon"] }
webp = "0.3"
base64 = "0.22"
ureq = { version = "2.12", default-features = false, features = ["tls", "socks-proxy"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
hex = "0.4"
# Match ort's ndarray; load-dynamic keeps installer small (ORT dylib downloaded on demand).
ndarray = "0.17"
half = "2"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "ndarray", "half", "std", "cuda", "coreml"] }
lopdf = { version = "0.47", default-features = false }
# Image clipboard (macOS/Linux WebView ClipboardItem is unreliable).
arboard = { version = "3", features = ["wayland-data-control"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Dock context menu (applicationDockMenu:) — same versions as tao/winit.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSLocale", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSMenu", "NSMenuItem"] }

[target.'cfg(not(windows))'.dependencies]
# macOS: Core Text; Linux/other Unix: Fontconfig — system libs only, tiny binary delta.
font-enumeration = "0.9"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
windows-future = { version = "0.3", features = ["std"] }
