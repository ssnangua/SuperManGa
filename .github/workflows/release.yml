name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
            rust_target: ""
            build_win: true
          - os: macos-latest
            name: macOS-arm64
            rust_target: aarch64-apple-darwin
            npm_build: build:mac
            extra_args: --target aarch64-apple-darwin
          # Apple Silicon runner 交叉编译 Intel；本项目无 Electron 原生 .node，一般可用。
          - os: macos-latest
            name: macOS-x64
            rust_target: x86_64-apple-darwin
            npm_build: build:mac
            extra_args: --target x86_64-apple-darwin
          # Pin Linux to Ubuntu 22.04 (glibc 2.35). Building on 24.04 (glibc 2.39)
          # yields binaries that fail on Debian 12 / Ubuntu 22.04 with
          # `GLIBC_2.39 not found`. Do not bump without raising the min glibc.
          - os: ubuntu-22.04
            name: Linux-x64
            rust_target: ""
            npm_build: build:linux
            extra_args: ""
          - os: ubuntu-22.04-arm
            name: Linux-arm64
            rust_target: ""
            npm_build: build:linux
            extra_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Include matrix.os so switching runners (e.g. ubuntu-24.04-arm → 22.04-arm)
      # does not restore an incompatible target/ via prefix match (same Linux-arm64).
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          if [ "v${PKG}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match package.json version ${PKG}"
            exit 1
          fi
          if [ "${PKG}" != "${TAURI}" ] || [ "${PKG}" != "${CARGO}" ]; then
            echo "Version mismatch: package.json=${PKG} tauri.conf.json=${TAURI} Cargo.toml=${CARGO}"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows portable
        if: matrix.build_win
        # beforeBuildCommand runs scripts/fetch-pdfium.mjs (honors TAURI_ENV_TARGET_TRIPLE).
        run: npm run build:win
        env:
          PDFIUM_TARGET: ${{ matrix.rust_target }}

      - name: Build macOS / Linux
        if: ${{ !matrix.build_win }}
        # beforeBuildCommand runs scripts/fetch-pdfium.mjs (honors TAURI_ENV_TARGET_TRIPLE).
        run: npm run ${{ matrix.npm_build }} -- ${{ matrix.extra_args }}
        env:
          PDFIUM_TARGET: ${{ matrix.rust_target }}

      # Tauri defaults to SuperManGa_0.1.0_amd64.deb / _aarch64.dmg; match Windows: SuperManGa-ver-os-arch.ext
      - name: Rename release artifacts
        if: ${{ !matrix.build_win }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          case "${{ matrix.name }}" in
            macOS-arm64) dest="SuperManGa-${VERSION}-macos-arm64.dmg"; glob='*.dmg' ;;
            macOS-x64)   dest="SuperManGa-${VERSION}-macos-x64.dmg";   glob='*.dmg' ;;
            Linux-x64)   dest="SuperManGa-${VERSION}-linux-x64.deb";   glob='*.deb' ;;
            Linux-arm64) dest="SuperManGa-${VERSION}-linux-arm64.deb"; glob='*.deb' ;;
            *) echo "Unknown matrix name: ${{ matrix.name }}"; exit 1 ;;
          esac
          src=""
          n=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            n=$((n + 1))
            src="$f"
          done < <(find src-tauri/target -type f -name "$glob")
          if [ "$n" -ne 1 ]; then
            echo "Expected 1 $glob, found $n:"
            find src-tauri/target -type f -name "$glob"
            exit 1
          fi
          mv "$src" "$(dirname "$src")/${dest}"
          echo "Renamed $src -> ${dest}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/portable/*.zip
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error

  publish:
    name: Publish to GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name '*.zip' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \
          \) -exec cp -t release/ {} +
          echo "Release files:"
          ls -lah release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
